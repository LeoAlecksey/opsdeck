# Обновления зависимостей раз в месяц, одним PR на экосистему, в ветку dev.
# Мажорные версии (vite 8, typescript 7, xterm 6, actions/checkout 7, tauri-action 1…) обновляем вручную: они ломают API.
# Исправления безопасности приходят отдельно и сразу (Dependabot security updates).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    target-branch: dev
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      cargo: { update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      npm: { update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule: { interval: monthly }
    groups:
      actions: { update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
