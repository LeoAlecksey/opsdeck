# Статический анализ безопасности (GitHub CodeQL): TypeScript/JavaScript, Rust и сами workflow
# (инъекции в CI, утечки секретов). Результаты — Security → Code scanning. Бесплатно для открытого
# репозитория. Запускается на PR в master/dev, пушах в master и раз в неделю.
name: codeql

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main, dev]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: codeql ${{ matrix.language }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust, actions]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
