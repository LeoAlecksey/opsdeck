# Сборка OpsDeck на нативных раннерах (своя ОС и архитектура, без кросс-компиляции).
# Пуш в main/master — все 5 платформ без публикации: в master пушим только при релизе, и эта сборка
# заполняет кэш Rust для всех платформ (тег может брать кэш только из master, поэтому следующий релиз
# пересобирает лишь сам OpsDeck). PR в master — быстрая проверка: только linux-x64 (+ артефакт в Actions).
# Ветка dev (внешние PR) сама не собирается — экономим минуты; проверка — вручную:
# Actions → build → Run workflow → ветка dev.
# Тег v* (удобнее через `npm run release -- 0.2.0 "что нового"`) и ручной запуск с галкой — все 5 платформ
# (Linux x64/arm64, Windows x64, macOS arm64/x64; Windows ARM не собирается — слишком мало пользователей);
# на теге релиз собирается черновиком и публикуется последним шагом, только если прошли
# проверки, все сборки и все тесты (с подписанными файлами обновлений latest.json):
#   tests — тесты Rust на Linux, Windows и macOS;
#   ui    — тесты интерфейса: vitest + Playwright на демо-данных;
#   e2e   — настоящее приложение через tauri-driver на Linux и Windows (на macOS WebDriver нет).
name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      all_platforms:
        description: "Собрать все 5 платформ (иначе только linux-x64)"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # какие платформы собирать: полный набор на тегах, пушах в master и по ручному запуску, иначе только linux-x64
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        shell: bash
        env:
          FULL: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')) || (github.event_name == 'workflow_dispatch' && inputs.all_platforms) }}
        run: |
          all='[
            {"name":"linux-x64","os":"ubuntu-22.04"},
            {"name":"linux-arm64","os":"ubuntu-22.04-arm"},
            {"name":"windows-x64","os":"windows-latest"},
            {"name":"macos-arm64","os":"macos-latest","target":"aarch64-apple-darwin"},
            {"name":"macos-x64","os":"macos-latest","target":"x86_64-apple-darwin"}
          ]'
          if [ "$FULL" = "true" ]; then m="$all"; else m=$(echo "$all" | jq -c '[.[] | select(.name == "linux-x64")]'); fi
          echo "matrix=$(echo "$m" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"

  checks:
    name: checks (types, audits)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc
      - name: Translations (no broken words, placeholders match)
        run: npm run i18n:check
      - name: Author links (donation, Telegram) not swapped
        run: node scripts/check-links.mjs
      - name: npm audit (high+)
        run: npm audit --audit-level=high
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit (RustSec)
        working-directory: src-tauri
        run: cargo audit

  # идёт параллельно с checks; на теге публикацию релиза держит job publish, который ждёт обоих.
  # ubuntu-22.04 — старый glibc: .deb/AppImage запускаются и на более новых дистрибутивах;
  # arm64-раннеры бесплатны для публичных репозиториев.
  # тесты Rust на всех трёх ОС: так ловится код только для Windows или только для macOS
  tests:
    name: tests rust ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev build-essential
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: tests-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
      # the frontend is embedded at compile time: an empty dist is enough for the tests
      - name: Frontend placeholder
        shell: bash
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib
      # static analysis of the Rust code: any clippy warning fails the build
      - name: cargo clippy
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: |
          rustup component add clippy
          cargo clippy --lib --tests -- -D warnings

  ui:
    name: tests ui (vitest + playwright)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (vitest)
        run: npm test
      - name: Playwright browser
        run: npx playwright install --with-deps chromium
      - name: UI tests (playwright, demo backend)
        run: npm run test:ui
      - name: Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

  # the real app: real backend and real shell, driven through tauri-driver
  e2e:
    name: tests e2e ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps (+ WebKitWebDriver, Xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev build-essential webkit2gtk-driver xvfb
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: e2e-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
      - run: npm ci
      - name: Build the app (debug, no installers)
        run: npx tauri build --debug --no-bundle
      - name: tauri-driver
        run: cargo install tauri-driver --locked
      - name: msedgedriver for WebView2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          "$PWD" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Run (Linux)
        if: runner.os == 'Linux'
        env:
          OPSDECK_BIN: src-tauri/target/debug/opsdeck
        run: |
          xvfb-run -a bash -c 'tauri-driver & sleep 2; node --test tests/e2e/app.test.mjs'
      - name: Does the app start? (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "src-tauri/target/debug/opsdeck.exe" -PassThru -RedirectStandardOutput app-out.txt -RedirectStandardError app-err.txt
          Start-Sleep -Seconds 15
          if ($p.HasExited) { "EXITED with code $($p.ExitCode)" } else { "running after 15 s"; Stop-Process -Id $p.Id -Force }
          "--- stdout"; Get-Content app-out.txt -ErrorAction SilentlyContinue | Select-Object -Last 40
          "--- stderr"; Get-Content app-err.txt -ErrorAction SilentlyContinue | Select-Object -Last 40
          "--- app log"; Get-ChildItem "$env:LOCALAPPDATA\dev.opsdeck.app\logs" -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName | Select-Object -Last 40 }
          "--- WebView2"; Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty pv
          "--- msedgedriver"; msedgedriver.exe --version
      - name: Run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OPSDECK_BIN: src-tauri/target/debug/opsdeck.exe
        run: |
          Start-Process -FilePath "$HOME/.cargo/bin/tauri-driver.exe" -NoNewWindow
          Start-Sleep -Seconds 3
          node --test tests/e2e/app.test.mjs

  build:
    name: build ${{ matrix.name }}
    needs: plan
    permissions:
      contents: write # черновик релиза на тегах
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - name: Release notes from the tag message
        if: env.RELEASE == 'true'
        shell: bash
        run: |
          git fetch --force origin "+${GITHUB_REF}:${GITHUB_REF}"
          {
            echo "RELEASE_NOTES<<__EOF__"
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}"
            echo "__EOF__"
          } >> "$GITHUB_ENV"

      # пакеты кэшируются между запусками вместо apt-get update + install каждый раз
      - name: Linux deps (WebKitGTK и т.д.)
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential
          version: ${{ matrix.os }}-1

      # the cache can come back incomplete (seen on the arm64 runner: no gdk-3.0.pc → gdk-sys fails);
      # if pkg-config can't see the libraries, install them the normal way
      - name: Linux deps check
        if: runner.os == 'Linux'
        run: |
          if ! pkg-config --exists gdk-3.0 gtk+-3.0 webkit2gtk-4.1 javascriptcoregtk-4.1 libsoup-3.0 librsvg-2.0; then
            echo "::warning::apt cache incomplete, installing packages"
            sudo apt-get update
            sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
              libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}
          cache-on-failure: true
          # кэш пишет только master (там собираются все платформы); теги, ветки и PR его только читают —
          # их копии всё равно никто не смог бы взять, а лимит кэша на репозиторий 10 ГБ
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - run: npm ci

      - name: Build (tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # подпись обновлений (только релизы): Settings → Secrets and variables → Actions
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # на тегах дополнительно собираются подписанные файлы обновлений + latest.json
          args: >-
            ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
            ${{ env.RELEASE == 'true' && '--config src-tauri/tauri.release.conf.json' || '' }}
          tagName: ${{ env.RELEASE == 'true' && github.ref_name || '' }}
          releaseName: OpsDeck ${{ github.ref_name }}
          releaseBody: ${{ env.RELEASE_NOTES }}
          # черновик: публикует его job publish, когда прошли проверки и все сборки
          releaseDraft: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opsdeck-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/*/release/bundle/macos/

  # релиз становится виден (и установленные копии видят обновление) только если всё зелёное
  publish:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, build, tests, ui, e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # builds that finish at the same moment overwrite each other's entries in latest.json:
      # assemble it once from all the signed files before the release becomes visible
      - name: Rebuild latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/latest-json.sh "${GITHUB_REF_NAME}"
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
