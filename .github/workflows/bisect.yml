name: bisect-win-tests
on:
  push:
    branches: ["bisect/**"]
permissions:
  contents: read
jobs:
  t:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      # no rust-cache: a clean build, to rule out a stale cache from master's older Cargo.lock
      - name: Frontend placeholder
        shell: bash
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib
