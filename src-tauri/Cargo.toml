[package]
name = "opsdeck"
version = "0.6.0"
edition = "2021"
description = "Desktop cockpit for DevOps engineers (Tauri backend)"
license = "MIT"
authors = ["LeoAlecksey"]
repository = "https://github.com/LeoAlecksey/opsdeck"

[lib]
name = "opsdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
base64 = "0.22"
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "time", "net"] }
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls", "ring", "http-proxy", "runtime"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
serde_yaml_ng = "0.10"
futures = "0.3"
chrono = "0.4"
flate2 = "1"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
sysinfo = "0.37"
netstat2 = "0.11"
strip-ansi-escapes = "0.2"
tauri-plugin-log = "2"
log = "0.4"
dirs = "6"
keepass = "0.15"
tauri-plugin-clipboard-manager = "2"
zeroize = "1"
uuid = { version = "1", features = ["v4"] }
tokio-tungstenite = "0.30"
# database panel: PostgreSQL, MySQL/MariaDB, Redis, MongoDB (ClickHouse goes over HTTP via reqwest)
tokio-postgres = "0.7"
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring"] }
redis = { version = "1", default-features = false, features = ["tokio-rustls-comp", "tls-rustls-insecure", "tls-rustls-webpki-roots"] }
mongodb = { version = "3", default-features = false, features = ["compat-3-0-0", "rustls-tls", "dns-resolver"] }
json5 = "1"
# local AI: unpack the llama.cpp engine, verify downloads
tar = "0.4"
zip = { version = "4", default-features = false, features = ["deflate"] }
sha2 = "0.10"
# secret-service (Linux), Keychain (macOS), Credential Manager (Windows)
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored", "apple-native", "windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# must match the versions tauri uses (embedded web panels reparent webviews in GTK)
gtk = "0.18"
webkit2gtk = "2.0"

# Быстрее локальные сборки (tauri dev, cargo test): полная отладочная информация только для
# своего кода (номера строк в трейсах остаются), зависимости — без неё; линковка заметно легче.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
